name: docs

# The site root is the latest release's docs (rebuilt on every tag); /next/ is main's (rebuilt on docs changes).
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      ["docs/**", "site/**", "examples/**", "runtime/src/**", "Sources/IPC/Protocol.swift", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Build the latest release's docs (site root)
        run: |
          git fetch --force --tags origin
          tag="$GITHUB_REF_NAME"
          [ "$GITHUB_REF_TYPE" = tag ] || tag="$(git tag -l 'v*' --sort=-v:refname | head -n 1)"
          echo "Site root: $tag's docs" >> "$GITHUB_STEP_SUMMARY"
          git worktree add "$RUNNER_TEMP/release" "$tag"
          cd "$RUNNER_TEMP/release/site"
          bun install --frozen-lockfile
          HALO_DOCS_VERSION="$tag" bun run build
          cp -R dist "$RUNNER_TEMP/pages"
      - name: Build main's docs (/next/)
        working-directory: site
        run: |
          bun install --frozen-lockfile
          HALO_DOCS_VERSION=next bun run build
          cp -R dist "$RUNNER_TEMP/pages/next"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
