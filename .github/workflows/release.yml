name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the release zip
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/package.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/halo-$version-macos.zip" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "halo ${{ steps.package.outputs.version }}" \
            --notes "Universal (arm64 + x86_64) build of halo ${{ steps.package.outputs.version }}."

      - name: Pin the release in the Nix flake
        run: |
          version="${{ steps.package.outputs.version }}"
          git fetch --no-tags origin main
          git checkout -B main origin/main
          scripts/bump-nix.sh "$version" "${{ steps.package.outputs.zip }}"
          if git diff --quiet -- nix/release.json; then
            echo "nix/release.json already pins $version" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release.json
          git commit -m "chore(nix): pin release $version"
          git push origin main
          echo "Pinned $version in nix/release.json on main" >> "$GITHUB_STEP_SUMMARY"
