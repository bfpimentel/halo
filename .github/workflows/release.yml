name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build the release zip
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/package.sh "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip=dist/halo-$version-macos.zip" >> "$GITHUB_OUTPUT"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" \
            --title "halo ${{ steps.package.outputs.version }}" \
            --notes "Universal (arm64 + x86_64) build of halo ${{ steps.package.outputs.version }}."
          echo "Published. Point the Nix flake at it with: \`scripts/bump-nix.sh ${{ steps.package.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
